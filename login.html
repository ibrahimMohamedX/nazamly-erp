<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
<script>(function(){var t;try{t=localStorage.getItem("nazamly-theme")||"";}catch(_){t="";}if(t==="light"){document.documentElement.setAttribute("data-theme","light");}})();</script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل الدخول — {{CLIENT_BRAND}}</title>
    <link rel="icon" type="image/png" href="nazamly.png" />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <!-- Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- Design System -->
    <link rel="stylesheet" href="styles/variables.css" />
<link rel="stylesheet" href="styles/light-theme.css" />

    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/overlays.css" />
    <link rel="stylesheet" href="styles/components.css" />
    <link rel="stylesheet" href="styles/pages/auth.css" />

    <!-- Firebase compat SDK (must precede vision-init.js) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <!-- Vision system bootstrap (loads all modules, fires vision-ready) -->
    <script src="core/vision-init.js"></script>
  </head>

  <body class="auth-body">
    <!-- Ambient glow orbs -->
    <div class="auth-glow auth-glow--primary" aria-hidden="true"></div>
    <div class="auth-glow auth-glow--secondary" aria-hidden="true"></div>

    <main class="auth-container" role="main">
      <div class="auth-card">
        <!-- Logo + Brand -->
        <header class="auth-header">
          <img
            src="nazamly.png"
            alt="شعار Nazamly"
            class="auth-logo"
            width="72"
            height="72"
          />
          <h1 class="auth-brand" id="brandTitle">Nazamly</h1>
          <p class="auth-subtitle">مساحة العمل الموحدة</p>
        </header>

        <!-- Login Form -->
        <form id="loginForm" class="auth-form" novalidate>
          <!-- Email -->
          <div class="form-group">
            <label class="form-label" for="email">البريد الإلكتروني</label>
            <div class="form-input-wrapper">
              <i class="fas fa-envelope form-input-icon" aria-hidden="true"></i>
              <input
                type="email"
                id="email"
                name="email"
                class="form-input"
                placeholder="example@company.com"
                autocomplete="email"
                inputmode="email"
                dir="ltr"
                required
              />
            </div>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label class="form-label" for="password">كلمة المرور</label>
            <div class="form-input-wrapper">
              <i class="fas fa-lock form-input-icon" aria-hidden="true"></i>
              <input
                type="password"
                id="password"
                name="password"
                class="form-input"
                placeholder="••••••••"
                autocomplete="current-password"
                minlength="6"
                dir="ltr"
                required
              />
            </div>
          </div>

          <!-- Inline error (hidden until needed) -->
          <div
            id="loginError"
            class="auth-error"
            role="alert"
            aria-live="assertive"
            hidden
          >
            <i class="fas fa-circle-exclamation" aria-hidden="true"></i>
            <span id="loginErrorText"></span>
          </div>

          <!-- Submit -->
          <button type="submit" id="loginBtn" class="btn btn-primary btn-full">
            <span id="btnText">تسجيل الدخول</span>
            <i
              id="btnSpinner"
              class="fas fa-circle-notch fa-spin"
              aria-hidden="true"
              hidden
            ></i>
          </button>
        </form>
      </div>

      <!-- Branding credit -->
      <p class="auth-watermark" aria-hidden="true">Powered by Nazamly ERP</p>
    </main>

    <!-- Page controller — all auth logic lives here -->
    <script src="pages/login.js"></script>
  </body>
</html>
